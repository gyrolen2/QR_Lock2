<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Lock Offline App</title>
    <!-- Include QR libraries directly from CDN (the Service Worker will cache these for offline use) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 5px; width: 100%; margin: 10px 0; cursor: pointer; }
        button:active { background: #0056b3; }
        #qr-reader { width: 100%; display: none; margin-top: 15px; }
        #qr-canvas-container { margin-top: 20px; position: relative; display: inline-block; }
        #qr-logo-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; display: none; }
        input[type="text"] { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        #result-message { font-weight: bold; margin-top: 15px; color: #333; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR Lock App</h2>
    
    <!-- Option 1: Scanner -->
    <button onclick="startScanner()">Option 1: Scan QR Code</button>
    <div id="qr-reader"></div>
    
    <hr style="margin: 20px 0;">

    <!-- Option 2: Generator -->
    <h3>Option 2: Generate</h3>
    <input type="text" id="qr-input-text" placeholder="Enter text to generate QR...">
    <button onclick="generateQR()">Generate Embedded QR</button>
    <div id="qr-canvas-container">
        <div id="qrcode"></div>
        <img id="qr-logo-overlay" src="QR_Lock_logo.png" alt="Logo">
    </div>
    
    <p id="result-message"></p>
</div>

<script>
    // --- BIRD SONG SYNTHESIZER ---
    function playBirdSong(qrText) {
        // Only trigger if the string starts with our custom audio header
        if (!qrText.startsWith("BS1:")) return false;
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notesData = qrText.replace("BS1:", "");
        const notes = notesData.split(";");
        
        let startTime = audioCtx.currentTime + 0.1;

        notes.forEach(note => {
            if(!note) return;
            const parts = note.split(',');
            const freq = parseInt(parts[0]);
            const durationSec = parseInt(parts[1]) / 1000;

            if (freq > 0) {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine'; // Sine wave replicates whistling
                osc.frequency.setValueAtTime(freq, startTime);
                // Slight pitch glide to make it sound organic
                osc.frequency.linearRampToValueAtTime(freq + 100, startTime + durationSec);

                // Attack and release volume envelope to prevent digital clicking
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(1, startTime + 0.02);
                gainNode.gain.setValueAtTime(1, startTime + durationSec - 0.02);
                gainNode.gain.linearRampToValueAtTime(0, startTime + durationSec);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + durationSec);
            }
            startTime += durationSec;
        });
        return true;
    }

    // --- SCANNER LOGIC ---
    let html5QrcodeScanner;
    function startScanner() {
        document.getElementById("qr-reader").style.display = "block";
        document.getElementById('result-message').innerText = "Starting camera...";
        
        if(!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
        }

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                html5QrcodeScanner.stop();
                document.getElementById("qr-reader").style.display = "none";
                
                // Route to audio engine or standard text display
                if (decodedText.startsWith("BS1:")) {
                    playBirdSong(decodedText);
                    document.getElementById('result-message').innerText = "Bird song sequence triggered!";
                } else {
                    document.getElementById('result-message').innerText = "Scanned: " + decodedText;
                }
            },
            (errorMessage) => { /* Ignore background scanning errors */ }
        ).catch(err => {
            document.getElementById('result-message').innerText = "Camera error: " + err;
        });
    }

    // --- GENERATOR LOGIC ---
    function generateQR() {
        const text = document.getElementById("qr-input-text").value;
        if (!text) {
            alert("Please enter some text.");
            return;
        }

        document.getElementById("qrcode").innerHTML = "";
        
        new QRCode(document.getElementById("qrcode"), {
            text: text,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M 
        });

        // Display the custom offline logo over the center
        document.getElementById("qr-logo-overlay").style.display = "block";
        document.getElementById('result-message').innerText = "QR Code Generated.";
    }

    // --- OFFLINE SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'qr-lock-cache-v3';
                const urlsToCache = [
                    './',
                    './index.html',
                    './QR_Lock_logo.png',
                    'https://unpkg.com/html5-qrcode',
                    'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'
                ];
                self.addEventListener('install', event => {
                    event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache)));
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(caches.match(event.request).then(response => response || fetch(event.request)));
                });
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl);
        });
    }
</script>
</body>
</html>
