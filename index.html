<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Lock Offline PWA</title>
    <!-- External Libraries (Cached by Service Worker for full offline use) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #eef2f5; padding: 20px; margin: 0; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; max-width: 420px; margin: 0 auto; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1a252f; }
        h3 { color: #34495e; margin-bottom: 10px; }
        button { background: #007bff; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; margin: 8px 0; cursor: pointer; transition: background 0.2s; }
        button:active { background: #0056b3; }
        #qr-reader { width: 100%; display: none; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        #qr-canvas-container { margin-top: 20px; position: relative; display: inline-block; }
        #qrcode img, #qrcode canvas { display: block; border-radius: 4px; }
        #qr-logo-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45px; height: 45px; display: none; background: #ffffff; padding: 2px; border-radius: 6px; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; }
        #result-message { font-weight: bold; margin-top: 15px; color: #2c3e50; word-wrap: break-word; min-height: 24px; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>QR Lock App</h2>
    
    <!-- Option 1: Scanner -->
    <button onclick="startScanner()">Option 1: Scan QR Code</button>
    <div id="qr-reader"></div>
    
    <hr>

    <!-- Option 2: Generator -->
    <h3>Option 2: Generate</h3>
    <input type="text" id="qr-input-text" placeholder="Enter payload or BS2: string...">
    <button onclick="generateQR()">Generate Embedded QR</button>
    
    <div id="qr-canvas-container">
        <div id="qrcode"></div>
        <img id="qr-logo-overlay" src="QR_Lock_logo.png" alt="Logo">
    </div>
    
    <p id="result-message"></p>
</div>

<script>
    // --- HIGH-RESOLUTION BIRD SONG SYNTHESIZER (BS2 Format) ---
    function playBirdSong(qrText) {
        if (!qrText.startsWith("BS2:")) return false;
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notesData = qrText.replace("BS2:", "");
        const notes = notesData.split(";");
        
        let startTime = audioCtx.currentTime + 0.1;

        notes.forEach(note => {
            if (!note) return;
            const parts = note.split(',');
            if (parts.length < 3) return;

            const freq = parseInt(parts[0]);
            const durationSec = parseInt(parts[1]) / 1000;
            const volume = parseInt(parts[2]) / 9.0; // Scaled 0-9 back to 0.0-1.0 percentage

            if (freq > 0 && volume > 0) {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine'; // Whistle frequency waveform
                osc.frequency.setValueAtTime(freq, startTime);
                
                // Pitch glide for natural vibrato
                osc.frequency.linearRampToValueAtTime(freq + 20, startTime + durationSec);

                // Dynamic volume envelope
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(volume, startTime + (durationSec * 0.2));
                gainNode.gain.setValueAtTime(volume, startTime + (durationSec * 0.8));
                gainNode.gain.linearRampToValueAtTime(0, startTime + durationSec);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + durationSec);
            }
            startTime += durationSec;
        });
        return true;
    }

    // --- SCANNER LOGIC ---
    let html5QrcodeScanner;
    function startScanner() {
        document.getElementById("qr-reader").style.display = "block";
        document.getElementById('result-message').innerText = "Starting camera...";
        
        if (!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
        }

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                html5QrcodeScanner.stop();
                document.getElementById("qr-reader").style.display = "none";
                
                // Route to synthesizer if high-resolution audio format, else display plain text
                if (decodedText.startsWith("BS2:")) {
                    const played = playBirdSong(decodedText);
                    if (played) {
                        document.getElementById('result-message').innerText = "High-Res Bird Song Playing...";
                    } else {
                        document.getElementById('result-message').innerText = "Audio play error.";
                    }
                } else if (decodedText.startsWith("BS1:")) {
                    // Backwards compatibility for BS1 legacy strings
                    document.getElementById('result-message').innerText = "Legacy BS1 audio detected. Re-encode with Python generator.";
                } else {
                    document.getElementById('result-message').innerText = "Scanned Payload: " + decodedText;
                }
            },
            (errorMessage) => { /* Ignore standard frame capture misses */ }
        ).catch(err => {
            document.getElementById('result-message').innerText = "Camera access error: " + err;
        });
    }

    // --- GENERATOR LOGIC ---
    function generateQR() {
        const text = document.getElementById("qr-input-text").value.trim();
        if (!text) {
            alert("Please enter text or a BS2 string to generate.");
            return;
        }

        document.getElementById("qrcode").innerHTML = "";
        
        new QRCode(document.getElementById("qrcode"), {
            text: text,
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M 
        });

        // Overlay custom logo centered on the QR canvas
        document.getElementById("qr-logo-overlay").style.display = "block";
        document.getElementById('result-message').innerText = "QR Code Generated Successfully.";
    }

    // --- SERVICE WORKER (100% Offline PWA Support) ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `
                const CACHE_NAME = 'qr-lock-cache-v4';
                const urlsToCache = [
                    './',
                    './index.html',
                    './QR_Lock_logo.png',
                    'https://unpkg.com/html5-qrcode',
                    'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'
                ];
                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
                    );
                });
                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request).then(response => response || fetch(event.request))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => {
                console.log('SW registration error:', err);
            });
        });
    }
</script>
</body>
</html>
